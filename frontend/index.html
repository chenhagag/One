<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="One" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>One – Meet, as you are.</title>
    <meta name="description" content="היכרות עמוקה עם AI, תובנות אישיות והתאמה אחת מדויקת. בלי סווייפים." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="One" />
    <meta property="og:title" content="One – Meet, as you are." />
    <meta property="og:description" content="היכרות עמוקה עם AI, תובנות אישיות והתאמה אחת מדויקת. בלי סווייפים." />
    <meta property="og:url" content="https://joinone.io" />
    <meta property="og:image" content="https://joinone.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="One – Meet, as you are." />
    <meta name="twitter:description" content="היכרות עמוקה עם AI, תובנות אישיות והתאמה אחת מדויקת. בלי סווייפים." />
    <meta name="twitter:image" content="https://joinone.io/og-image.png" />
  </head>
  <body>
    <!-- Loading indicator — visible immediately while JS loads -->
    <div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:system-ui;color:#aaa">Loading...</div></div>
    <script>
      // Force unregister old service workers (they cache stale JS on Safari)
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        });
      }
    </script>
    <script>
      // Global error catcher
      var isDev = location.hostname === "localhost" || location.hostname === "127.0.0.1";
      // Known harmless errors to suppress (cross-origin Supabase SDK errors on Safari)
      var ignoredErrors = ["Script error.", "Script error", "ResizeObserver loop"];
      function isIgnored(msg) {
        if (!msg) return false;
        var s = String(msg);
        for (var i = 0; i < ignoredErrors.length; i++) { if (s.indexOf(ignoredErrors[i]) !== -1) return true; }
        return false;
      }
      window.onerror = function(msg, src, line, col, err) {
        if (isIgnored(msg)) { console.warn("[suppressed]", msg); return true; }
        if (!isDev) return; // production: silent
        var d = document.createElement("div");
        d.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99999;background:#ff0;color:#000;padding:12px;font:12px monospace;white-space:pre-wrap;word-break:break-all";
        d.textContent = "JS ERROR: " + msg + "\nSource: " + src + ":" + line + ":" + col + "\n" + (err && err.stack ? err.stack : "");
        document.body.appendChild(d);
      };
      window.addEventListener("unhandledrejection", function(e) {
        var reason = e.reason && e.reason.message ? e.reason.message : String(e.reason || "");
        if (isIgnored(reason)) { console.warn("[suppressed]", reason); e.preventDefault(); return; }
        if (!isDev) return; // production: silent
        var d = document.createElement("div");
        d.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99999;background:#ff0;color:#000;padding:12px;font:12px monospace;white-space:pre-wrap;word-break:break-all";
        d.textContent = "UNHANDLED PROMISE: " + (e.reason && e.reason.stack ? e.reason.stack : e.reason);
        document.body.appendChild(d);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Capture beforeinstallprompt early — it may fire before React mounts
      window.__pwaInstallPromptFired = false;
      window.addEventListener("beforeinstallprompt", function(e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
        window.__pwaInstallPromptFired = true;
      });
    </script>
  </body>
</html>
