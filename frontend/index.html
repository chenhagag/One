<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="One" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/heartIcon.jpg" />
    <title>One</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      }
      // Capture beforeinstallprompt early — it may fire before React mounts
      window.__pwaInstallPromptFired = false;
      window.addEventListener("beforeinstallprompt", function(e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
        window.__pwaInstallPromptFired = true;
        console.log("[PWA] beforeinstallprompt captured globally");
      });
      console.log("[PWA] listener registered, UA:", navigator.userAgent);
    </script>
  </body>
</html>
