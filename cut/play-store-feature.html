<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1024px; height: 500px; overflow: hidden; }
  .banner {
    width: 1024px;
    height: 500px;
    background: linear-gradient(135deg, #1a1a2e 0%, #2d1b4e 40%, #4a2d7a 70%, #6366f1 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    position: relative;
    overflow: hidden;
  }
  .banner::before {
    content: '';
    position: absolute;
    width: 600px; height: 600px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.06);
    top: -200px; right: -100px;
  }
  .banner::after {
    content: '';
    position: absolute;
    width: 400px; height: 400px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.04);
    bottom: -150px; left: -50px;
  }
  .logo-section {
    position: relative;
    z-index: 1;
  }
  .logo-section img {
    height: 200px;
    object-fit: contain;
  }
  .text-section {
    position: relative;
    z-index: 1;
    color: #fff;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .tagline {
    font-size: 28px;
    font-weight: 300;
    color: rgba(255,255,255,0.85);
    letter-spacing: 2px;
  }
  .tagline-he {
    font-size: 20px;
    font-weight: 400;
    color: rgba(255,255,255,0.55);
    direction: rtl;
  }
</style>
</head>
<body>
<div class="banner">
  <div class="logo-section">
    <img src="logos/logo_dark mode.png" alt="One" />
  </div>
  <div class="text-section">
    <div class="tagline">Meet, as you are.</div>
    <div class="tagline-he">היכרויות חכמות מבוססות AI</div>
  </div>
</div>
</body>
</html>
