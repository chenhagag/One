<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&family=Cormorant+Garamond:wght@400;500&family=JetBrains+Mono:wght@300;400&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0E0A4D;font-family:'Heebo',sans-serif;display:flex;flex-direction:column;align-items:center;padding:0;gap:0}

.wrap{
  width:min(100vw, 1080px);
  aspect-ratio:1/1;
  overflow:hidden;
}

.frame{
  width:1080px;height:1080px;
  overflow:hidden;
  position:relative;
  display:flex;flex-direction:column;
  justify-content:space-between;
  direction:rtl;
  transform-origin:top right;
}

.frame.dark{background:#0E0A4D}

.grain{position:absolute;inset:0;opacity:1;mix-blend-mode:multiply;pointer-events:none;z-index:1;background-size:510px 510px}
.frame.dark .grain{mix-blend-mode:screen;opacity:0.5}

/* Icon ornament */
.icon-orb{position:absolute;pointer-events:none;z-index:1;width:400px;height:400px;object-fit:cover;object-position:bottom left;opacity:0.5;border-radius:50%;transform:rotate(3deg);top:-165px;right:-148px}

/* Zones */
.zone{position:relative;z-index:3;padding:64px 85px}
.zone-top{padding-bottom:0;min-height:90px}
.zone-mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding-top:0;padding-bottom:0}
.zone-bot{padding-top:28px;display:flex;align-items:center;justify-content:space-between;border-top:1.5px solid rgba(107,95,208,0.25)}

/* Anchor line */
.anchor-line{height:4px;background:linear-gradient(270deg,#9890D8,rgba(152,144,216,0.06));width:170px;margin-bottom:40px;border-radius:2px}

/* Headline */
.headline{font-family:'Cormorant Garamond',serif;font-size:68px;font-weight:500;color:#E8E6FF;line-height:1.28;margin-bottom:36px}
.dot-accent{color:#B0A8FF;font-size:1.05em}

/* Body */
.body-text{font-size:32px;font-weight:300;color:#9890D8;line-height:1.65;letter-spacing:0.4px}
.body-text strong{color:#D4D0F5;font-weight:500;font-family:'Cormorant Garamond',serif;font-size:36px}
.body-text .gap{display:block;height:20px}

/* CTA block */
.cta-block{margin-top:44px;padding-top:36px;border-top:1.5px solid rgba(107,95,208,0.25)}
.cta-main{display:block;font-family:'Cormorant Garamond',serif;font-size:44px;font-weight:500;color:#E8E6FF;letter-spacing:1px;margin-bottom:8px}
.cta-sub{display:block;font-size:28px;font-weight:300;color:#6B5FD0;letter-spacing:0.5px}

/* Footer */
.footer-tag{font-family:'JetBrains Mono',monospace;font-size:24px;color:#6B5FD0;letter-spacing:2.8px;display:flex;align-items:center;direction:ltr}
.footer-tag .tag-dot{color:#9890D8;margin-right:6px}
.footer-mark{font-family:'JetBrains Mono',monospace;font-size:25px;color:#9890D8;letter-spacing:7px;font-weight:400}
</style>
</head>
<body>

<!-- CAMPAIGN SLIDE - FEMALE-FF VERSION -->
<div class="wrap"><div class="frame dark" id="frame-1">
  <div class="grain"></div>
  <img class="icon-orb" src="icon_only.png" alt="">
  <div class="zone zone-top"></div>
  <div class="zone zone-mid">
    <div class="headline" style="transform:rotate(-0.3deg)">את לא צריכה לחפש<span class="dot-accent">.</span><br>One מחפש בשבילך<span class="dot-accent">.</span></div>
    <div class="anchor-line"></div>
    <div class="body-text">
      בלי סווייפים. בלי לרדוף אחרי מאצ׳ים.
      <span class="gap"></span>
      מכירים אותך לעומק,<br>
      מחפשים מאחורי הקלעים,<br>
      ופונים אלייך כשיש מישהי<br>
      שבאמת שווה להכיר.
      <span class="gap"></span>
      <div class="cta-block">
        <span class="cta-main">הצטרפי ל-One</span>
        <span class="cta-sub">סוכן AI להיכרויות שעובד בשבילך.</span>
      </div>
    </div>
  </div>
  <div class="zone zone-bot">
    <span class="footer-tag">meet, as you are<span class="tag-dot">.</span></span>
    <span class="footer-mark">One</span>
  </div>
</div></div>

<script>
const grainSVG = `<svg xmlns='http://www.w3.org/2000/svg' width='510' height='510' viewBox='0 0 510 510'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.3' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='linear' slope='0.65'/></feComponentTransfer></filter><rect width='510' height='510' filter='url(%23n)'/></svg>`;
const grainBg = `data:image/svg+xml,${encodeURIComponent(grainSVG)}`;
document.querySelectorAll('.grain').forEach(el => {
  el.style.backgroundImage = `url('${grainBg}')`;
});

function scaleSlides() {
  document.querySelectorAll('.wrap').forEach(wrap => {
    const frame = wrap.querySelector('.frame');
    const scale = wrap.offsetWidth / 1080;
    frame.style.transform = `scale(${scale})`;
    frame.style.transformOrigin = 'top right';
  });
}
scaleSlides();
window.addEventListener('resize', scaleSlides);
</script>

</body>
</html>
